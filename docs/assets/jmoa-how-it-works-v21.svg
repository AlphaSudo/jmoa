<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How JMOA turns a representative workload into a scoped JVM memory claim</title>
  <desc id="desc">An eight-stage evidence pipeline: profile, admit, transform, audit, materialize, prove, confirm, then publish a scoped claim or reject the candidate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="0.55" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32c7e8"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12322d"/>
      <stop offset="0.49" stop-color="#12322d"/>
      <stop offset="0.51" stop-color="#321a20"/>
      <stop offset="1" stop-color="#321a20"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9fb2c3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49cde7"/>
    </marker>
    <style>
      .eyebrow { font: 700 17px 'Segoe UI', Arial, sans-serif; letter-spacing: 3px; fill: #65d7ee; }
      .heading { font: 750 46px 'Segoe UI', Arial, sans-serif; fill: #f7fafc; }
      .subheading { font: 400 21px 'Segoe UI', Arial, sans-serif; fill: #9fb2c3; }
      .number { font: 800 16px 'Segoe UI', Arial, sans-serif; fill: #07111b; }
      .card-title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #f7fafc; }
      .card-copy { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #aebdca; }
      .card-copy-strong { font: 650 16px 'Segoe UI', Arial, sans-serif; fill: #d7e2ea; }
      .decision-title { font: 750 24px 'Segoe UI', Arial, sans-serif; fill: #f7fafc; }
      .decision-copy { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #b7c5cf; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <rect width="1600" height="900" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="12" height="900" rx="6" fill="url(#accent)"/>

  <text x="78" y="72" class="eyebrow">JMOA 2.1 · EVIDENCE-GATED PIPELINE</text>
  <text x="78" y="132" class="heading">From workload evidence to a defensible RAM claim</text>
  <text x="78" y="174" class="subheading">The optimization is accepted only when the built deployment survives artifact, semantic, and system-memory proof.</text>

  <!-- connecting arrows: first row -->
  <path d="M 410 330 H 455" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 775 330 H 820" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1140 330 H 1185" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1345 420 V 456 H 255 V 492" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- connecting arrows: second row -->
  <path d="M 410 610 H 455" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 775 610 H 820" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1140 610 H 1185" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1345 700 V 735" stroke="#49cde7" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- stage 1 -->
  <g filter="url(#shadow)">
    <rect x="90" y="240" width="320" height="180" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="130" cy="280" r="19" fill="#55d4eb"/>
    <text x="130" y="286" text-anchor="middle" class="number">1</text>
    <text x="165" y="288" class="card-title">Profile</text>
    <text x="120" y="333" class="card-copy">Representative workload</text>
    <text x="120" y="365" class="card-copy-strong">Stable lambda-site identities</text>
    <text x="120" y="391" class="card-copy-strong">and invocation evidence</text>
  </g>

  <!-- stage 2 -->
  <g filter="url(#shadow)">
    <rect x="455" y="240" width="320" height="180" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="495" cy="280" r="19" fill="#55d4eb"/>
    <text x="495" y="286" text-anchor="middle" class="number">2</text>
    <text x="530" y="288" class="card-title">Admit</text>
    <text x="485" y="333" class="card-copy">Safe, useful candidates only</text>
    <text x="485" y="365" class="card-copy-strong">Explicit structural rules</text>
    <text x="485" y="391" class="card-copy-strong">Unsafe sites remain unchanged</text>
  </g>

  <!-- stage 3 -->
  <g filter="url(#shadow)">
    <rect x="820" y="240" width="320" height="180" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="860" cy="280" r="19" fill="#55d4eb"/>
    <text x="860" y="286" text-anchor="middle" class="number">3</text>
    <text x="895" y="288" class="card-title">Transform</text>
    <rect x="850" y="323" width="260" height="31" rx="15" fill="#173747"/>
    <text x="980" y="344" text-anchor="middle" class="card-copy-strong">Lambda / adapter rewriting</text>
    <rect x="850" y="365" width="260" height="31" rx="15" fill="#173747"/>
    <text x="980" y="386" text-anchor="middle" class="card-copy-strong">Audited LVT / LVTT reduction</text>
  </g>

  <!-- stage 4 -->
  <g filter="url(#shadow)">
    <rect x="1185" y="240" width="320" height="180" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="1225" cy="280" r="19" fill="#55d4eb"/>
    <text x="1225" y="286" text-anchor="middle" class="number">4</text>
    <text x="1260" y="288" class="card-title">Audit bytes</text>
    <text x="1215" y="333" class="card-copy">Preservation + reproducibility</text>
    <text x="1215" y="365" class="card-copy-strong">Reject unexplained changes</text>
    <text x="1215" y="391" class="card-copy-strong">Bind reports to exact inputs</text>
  </g>

  <!-- stage 5 -->
  <g filter="url(#shadow)">
    <rect x="90" y="500" width="320" height="200" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="130" cy="540" r="19" fill="#55d4eb"/>
    <text x="130" y="546" text-anchor="middle" class="number">5</text>
    <text x="165" y="548" class="card-title">Materialize</text>
    <text x="120" y="593" class="card-copy">Build the real deployment</text>
    <rect x="120" y="623" width="116" height="34" rx="17" fill="#173747"/>
    <text x="178" y="646" text-anchor="middle" class="card-copy-strong">Fat JAR</text>
    <rect x="248" y="623" width="132" height="34" rx="17" fill="#173747"/>
    <text x="314" y="646" text-anchor="middle" class="card-copy-strong">Exploded Boot</text>
  </g>

  <!-- stage 6 -->
  <g filter="url(#shadow)">
    <rect x="455" y="500" width="320" height="200" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="495" cy="540" r="19" fill="#55d4eb"/>
    <text x="495" y="546" text-anchor="middle" class="number">6</text>
    <text x="530" y="548" class="card-title">Prove identity</text>
    <text x="485" y="593" class="card-copy">Hashes · replacements · origins</text>
    <text x="485" y="628" class="card-copy-strong">Verify JVM policy and launch shape</text>
    <text x="485" y="658" class="card-copy-strong">No stale or unintended bytecode</text>
  </g>

  <!-- stage 7 -->
  <g filter="url(#shadow)">
    <rect x="820" y="500" width="320" height="200" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="860" cy="540" r="19" fill="#55d4eb"/>
    <text x="860" y="546" text-anchor="middle" class="number">7</text>
    <text x="895" y="548" class="card-title">Confirm semantics</text>
    <text x="850" y="593" class="card-copy">Health + representative behavior</text>
    <text x="850" y="628" class="card-copy-strong">Mutation and response proofs</text>
    <text x="850" y="658" class="card-copy-strong">Failures stop the campaign</text>
  </g>

  <!-- stage 8 -->
  <g filter="url(#shadow)">
    <rect x="1185" y="500" width="320" height="200" rx="18" fill="#101e2b" stroke="#2d4658" stroke-width="2"/>
    <circle cx="1225" cy="540" r="19" fill="#55d4eb"/>
    <text x="1225" y="546" text-anchor="middle" class="number">8</text>
    <text x="1260" y="548" class="card-title">Measure the system</text>
    <text x="1215" y="593" class="card-copy">Paired PSS + cgroup evidence</text>
    <text x="1215" y="628" class="card-copy-strong">Heap · native · file · CPU · startup</text>
    <text x="1215" y="658" class="card-copy-strong">Qualified same-artifact controls</text>
  </g>

  <!-- terminal decision -->
  <g filter="url(#shadow)">
    <rect x="260" y="750" width="1080" height="105" rx="20" fill="url(#decision)" stroke="#3b5262" stroke-width="2"/>
    <line x1="800" y1="767" x2="800" y2="838" stroke="#7990a1" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="320" cy="802" r="22" fill="#42d392"/>
    <path d="M309 802 l8 8 15-18" fill="none" stroke="#07111b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="795" class="decision-title">Publish a scoped claim</text>
    <text x="360" y="824" class="decision-copy">Only the measured deployment and disclosed costs.</text>
    <circle cx="860" cy="802" r="22" fill="#ff6b6b"/>
    <path d="M851 793 l18 18 M869 793 l-18 18" stroke="#07111b" stroke-width="5" stroke-linecap="round"/>
    <text x="900" y="795" class="decision-title">Or reject the candidate</text>
    <text x="900" y="824" class="decision-copy">Safety, semantics, variance, or economics can veto.</text>
  </g>
</svg>
